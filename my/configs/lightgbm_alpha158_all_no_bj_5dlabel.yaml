# 实验：5日 label 对照
# 相对 lightgbm_alpha158_all_no_bj_2020_2026.yaml（现役复刻）只改一个变量：
#   label 从默认 1 日（Ref($close,-2)/Ref($close,-1)-1）改为 5 日（Ref($close,-6)/Ref($close,-1)-1）
# 目的：裁决"label 与持有期对齐"能挽回多少样本外表现（针对涨停逆向选择 + 持有期错配）。
qlib_init:
    provider_uri: "/Users/bytedance/code/qlib/my/data/cn_data"
    region: cn
    kernels: 4
    joblib_backend: threading
market: &market all_no_bj
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2020-01-01
    end_time: 2026-07-28
    fit_start_time: 2020-01-01
    fit_end_time: 2022-12-31
    instruments: *market
    label: ["Ref($close, -6) / Ref($close, -1) - 1"]
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 2
            hold_thresh: 2
    backtest:
        start_time: 2025-01-01
        end_time: 2026-07-28
        account: 50000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
    executor:
        class: SimulatorExecutor
        module_path: qlib.backtest.executor
        kwargs:
            time_per_step: day
            generate_portfolio_metrics: true
            verbose: false
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.0421
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 8
            num_boost_round: 2000
            early_stopping_rounds: 100
            verbose_eval: 50
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2020-01-01, 2022-12-31]
                valid: [2023-01-01, 2024-12-31]
                test: [2025-01-01, 2026-07-28]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
